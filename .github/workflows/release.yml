name: Release

# Changesets flow:
#   1. A PR merges to main carrying .changeset/*.md files.
#   2. This job pushes the `changeset-release/main` branch and tries to open the
#      "Version Packages" PR. The Aktiga org forbids Actions from creating PRs, so
#      that step fails; open the PR by hand: `gh pr create --head changeset-release/main`.
#   3. Merging that PR re-runs this job, which publishes to npm.
#
# Auth: NPM_TOKEN secret (granular token, read/write on the @klank scope, 2FA bypass).
# Trusted Publishing (OIDC) is only possible after the first token-based publish and
# needs npm >= 11.5.1 plus a pnpm that no longer forwards `--no-git-checks` to npm
# (npm 11 rejects unknown flags with EUNKNOWNCONFIG); keep Node's bundled npm 10 until then.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    if: github.repository == 'Aktiga/klank-sdk'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build
      - name: Version packages or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
